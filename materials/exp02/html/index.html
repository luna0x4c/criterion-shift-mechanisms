<script>

    // n=960
    var stim_real = stim_960;


    var consent_1 = '<p style = "font-weight:bold;">CONSENT FORM PAGE 1/5</p>' +
        '<p>Protocol Number: 29-20-0068</p><p>Approved by the UCSB Human Subjects Committee for use thru: 02/09/2022</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">SUMMARY OF KEY INFORMATION:</p>' +
        '<p>The purpose of this study is to better understand how people make decisions in different situations. You are being asked to participate in a computer task. The computer task is self-paced but, the overall expected time commitment will be about 30-60 minutes. You may not directly benefit from this study, but your participation will inform us on how people make decisions. The online computer task can be boring and you may become mentally fatigued during the task. We may share your de-identified data with our collaborators at the United States Army Research Laboratory. This research is funded by the U.S. Department of Defense.</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">PURPOSE:</p>' +
        '<p>You are being asked to participate in a research study. Your participation is voluntary. Please feel free to ask questions at any time if there is anything you do not understand. The goal of these experiments is to investigate how you make decisions and inferences under different circumstances. We may use the data gathered in this experiment to improve the task for use in subsequent experiments. The data obtained through your participation may be included with data from other subjects as part of a scientific study to appear in the peer reviewed literature. The Department of Defense is funding the research study.</p>'
    ;
    var consent_2 = '<p style = "font-weight:bold;">CONSENT FORM PAGE 2/5</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">PROCEDURE: </p>' +
        '<p>If you decide to participate, we will ask you to do two things. You will first be given a behavioral test on a computer where you will be asked to classify an image or remember information presented on the computer screen. The second is to participate in assessments that are intended to assess certain characteristics and traits about you that can explain individual differences. These self-assessments will include tests of personality, executive functioning, cognitive flexibility, styles of learning, etc. None of the assessments will have identifying information about you. These sessions may last between 30 and 60 minutes. Up to 500 subjects will be tested.</p>' +
        '<p>All data will be collected during the testing as part of the computer program, and will be automatically anonymized. Data will only be accessible to experimenters within the lab. You will either receive course credit or monetary compensation for your participation in the experiment. If you choose to withdraw at any point, you will still receive credit/compensation. The only equipment used is a computer, which presents visual stimuli and record responses. You will be required to attend to stimuli throughout the experiment and respond as best as you can.</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">RISKS: </p>' +
        '<p>There is minimal risk from the behavioral testing. The risks are similar to those from working on a computer for an extended amount of time, such as mental fatigue.</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">BENEFITS: </p>' +
        '<p>There are no direct benefits to you for participating in the experiment. These data are collected purely for the purpose of research and do not have a clinical or diagnostic value.</p>'
    ;
    var consent_3 = '<p style = "font-weight:bold;">CONSENT FORM PAGE 3/5</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">CONFIDENTIALITY: </p>' +
        '<p>All information you provide will be kept confidential except as required by law. Absolute confidentiality cannot be guaranteed, since research documents are not protected from subpoena. Your name will not be used in any publication that may result from this study. Your name or other personal information will not be used to identify your performance data. Questionnaires will be administered online.</p>' +
        '<p>When responses are submitted online, they are added to a private database that is accessible only by lab personnel using a highly secure password. All responses will be coded by a subject ID that is not traceable. The Office of the Committee for the Protection of Human Subjects at UCSB may request access to this form to ensure procedures designed to protect research participants are being properly followed. Representatives of the U.S. Army Medical Research and Materiel Command are eligible to review research records as a part of their responsibility to protect human subjects in research. Data gathered from this study will be maintained by the investigator indefinitely or as required by federal or state regulation. Your de-identified data might be shared with research collaborators at UC Santa Barbara, the Army Research Laboratory, and possibly researchers at other universities for research purposes only.</p>' +
        '<p>The Department of Defense (DOD) is funding this research study. The DOD or Federal Representatives may access research records for the protection of human subjects. We may share your data with our collaborators at the United States Army Research Laboratory.</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">COST/PAYMENT: </p>' +
        '<p>There are no costs to you for your participation in this study. You will receive compensation for participating using the following guidelines: Up to $30 based on task performance</p>'
    ;
    var consent_4 = '<p style = "font-weight:bold;">CONSENT FORM PAGE 4/5</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">RIGHT TO REFUSE OR WITHDRAW: </p>' +
        '<p>You may refuse to participate and still receive any benefits you would receive if you were not in the study. You may change your mind about being in the study and quit after the study has started.</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">PRINCIPAL INVESTIGATORS DISCLOSURE OF PERSONAL AND FINANCIAL INTERESTS IN THE RESEARCH AND STUDY PROGRAM:</p>' +
        '<p>The study investigators have no financial interest in this research and will not benefit monetarily from this study.</p>' +
        '<p style = "font-weight:bold;text-decoration:underline;">QUESTIONS: </p>' +
        '<p>If you have any questions about this research project or if you think you may have been injured as a result of your participation, please contact: Dr. Michael Miller by phone at (805) 893-6190 or by email at michael.miller@psych.ucsb.edu. If you have any questions regarding your rights and participation as a research subject, please contact the Human Subjects Committee at (805) 893-3807 or hsc@research.ucsb.edu. Or write to the University of California, Human Subjects Committee, Office of Research, Santa Barbara, CA 93106-2050.</p>'
    ;
    var consent_5 = '<p style = "font-weight:bold;">CONSENT FORM PAGE 5/5</p>' +
        '<p style = "font-weight:bold;">If you AGREE to participate in this study, please click Next to advance to instructions.</p>' +
        '<p style = "font-weight:bold;">If you REFUSE to participate, please close the page to be withdrawn from the study.</p>'
    ;



    var ins_hi = '<pre style = "font-family:OpenSans,sans-serif; font-weight:bold; font-size:18px;">Hello! Welcome to the study.</pre>' +
                 '<p>Please read the following instructions carefully. Ask the experimenter if you have any questions.</p>' +
                 '<p>Press ENTER (RETURN if you are using an Apple device) on your keyboard to continue.</p>';


    var ins_baseline_test_pre = '<p>Next, you will be tested on your memory of the images you just saw.</p>' +
    '<p>You will press keys on your keyboard to indicate whether an image is </p>' +
    '<p style = "font-weight: bold;"old</p>' + '<p> (you saw it in the study session earlier) or </p>' +
    '<p style = "font-weight: bold;"new</p>' + '<p> (it did not appear in the study session).</p>' +
    '<p>Do not hesitate for too long on each image.</p>' +
    '<p>Press SPACE to continue.</p>';
    var ins_baseline_t1 = '<p>Press ENTER to start the first memory test.</p>';
    var ins_baseline_t2 = '<p>Press ENTER to start the second memory test.</p>';
    var ins_test_1 = ins_baseline_t1;
    var ins_test_2 = ins_baseline_t2;

    var ins_nb_study = '<p>Next, you will see another set of images, to be tested in a memory test later.</p>' +
        '<p>None of these images have appeared in memory or test sessions earlier, so please do your best to remember each one.</p>' +
        '<p>When you are ready, press ENTER to begin viewing the images.</p>';
    var ins_nb_test_pre = '<p>Next, you will be tested on your memory of the images you just saw, just like the previous memory tests.</p>' +
        '<p>None of the images you will see have appeared in previous sessions, so your memory decisions should be based on the current memory session only.</p>' +
        '<p>With each image, there will be hints or information to help you make your memory decision.</p>' +
        '<p>You can utilize those information to improve your accuracy and receive a higher payout.</p>' +
        '<p>Press SPACE to continue.</p>';
    var ins_prob_t1 = ins_baseline_t1;
    var ins_prob_t2 = ins_baseline_t2;

    //var ins_fpf_study = ins_prob_study;
    //var ins_fpf_test_pre = ins_prob_test_pre;
    var ins_fpf_t1 = ins_baseline_t1;
    var ins_fpf_t2 = ins_baseline_t2;


    // initializing timeline
    var timeline = [];

    /* init connection with pavlovia.org */
    var pavlovia_init = {
        type: "pavlovia",
        command: "init",
    };
    timeline.push(pavlovia_init);

    // preload media (stim images)
    var preload_media = {
        type: 'preload',
        auto_preload: true,
        show_progress_bar: true // false to hide progress bar
    };
    timeline.push(preload_media);



    // randomizer function: getRandomInt
    function roll_dice(min, max) {
        min = Math.ceil(min);
        max = Math.floor(max);
        return Math.floor(Math.random() * (max - min) + min);
        //The maximum is exclusive and the minimum is inclusive
    }
    randomizer = roll_dice(1, 3);    // roll between 1,2
    //console.log("if there is a number, randomizer works", randomizer)          // meaningless console log for verifying randomizer only

    // ==================== randomize specs ============================
    // old/new key location:
    var old_new_key = roll_dice(1,3);
    if (old_new_key === 1) {
        var this_old_key = 'f';
        var this_new_key = 'j';
        var old_new_key_prompt = '<p></p><pre style = "font-family:OpenSans,sans-serif; font-weight:bold; font-size:20px;">f=old                    j=new</pre>';
        var old_new_key_prompt_text = 'f=old, j=new';
    } else if (old_new_key === 2) {
        this_old_key = 'j';
        this_new_key = 'f';
        old_new_key_prompt = '<p></p><pre style = "font-family:OpenSans,sans-serif; font-weight:bold; font-size:20px;">f=new                    j=old</pre>';
        old_new_key_prompt_text = 'f=new, j=old';
    }
    //console.log("old/new key placement: 1=fj, 2=jf", old_new_key);
    // tag old/new key position to all data (redundancy!)
    jsPsych.data.addProperties({
        old_new_key: old_new_key_prompt_text
    });
    

    // ==================== load all materials ========================
    // convert csv to json: csvjson.com
    // create standalone json data (as a .js file in exp folder) as a new var


    // ==================== shuffle stim list function =================
    function shuffleArray(array) {  // shuffle a one dimensional array / one level shuffling
        for (var i = array.length-1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i+1));
            var temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }
    }

    // ==================== divide & assign study/test lists ==========
    var baseline_studied = [];
    var baseline_old = [];
    var baseline_new = [];
    var prob_studied = [];
    var prob_old = [];
    var prob_new = [];
    var fpf_studied = [];
    var fpf_old = [];
    var fpf_new = [];

    var study_list_length = 160;    // initialize study list (block) length
    // if stim length changes, change here so no need to edit for each list/block

    // IMPORTANT: convert 2+D array (loaded as json file) into 1D array so that shuffle & subset can work properly
    //var stim_path = stim_real.map(x => x.img_name);   // this doesn't work

    var stim_path = [];
    for (var i = 0; i < study_list_length*6; i++) {
        stim_path.push(stim_real[i].img_name);
    }
    shuffleArray(stim_path);

    for (var i = 0; i < study_list_length; i++) {
        // 0-99 old, 100-199 new
        baseline_studied.push(stim_path[i]);
        baseline_old[i] = baseline_studied[i];
        baseline_new[i] = stim_path[i+study_list_length];

        // 200-299 old, 300-399 new
        prob_studied[i] = stim_path[i+2*study_list_length];
        prob_old[i] = prob_studied[i];
        prob_new[i] = stim_path[i+3*study_list_length];

        // 400-499 old, 500-599 new
        fpf_studied[i] = stim_path[i+4*study_list_length];
        fpf_old[i] = fpf_studied[i];
        fpf_new[i] = stim_path[i+5*study_list_length];
    }

    shuffleArray(baseline_studied);
    shuffleArray(prob_studied);
    shuffleArray(fpf_studied);

    baseline_old = baseline_studied;      // re-inherit all already studied items (just to make sure the two lists are the same)
    prob_old = prob_studied;
    fpf_old = fpf_studied;

    shuffleArray(baseline_old);    // shuffle again
    shuffleArray(baseline_new);
    shuffleArray(prob_old);
    shuffleArray(prob_new);
    shuffleArray(fpf_old);
    shuffleArray(fpf_new);

    var baseline_lib = [];
    var baseline_con = [];
    var prob_lib = [];
    var prob_con = [];
    var fpf_lib = [];
    var fpf_con = [];

    for (i = 0; i < study_list_length*0.75; i++) {
        baseline_lib.push({img_name: baseline_old[i], studied: 1});
        baseline_con.push({img_name: baseline_new[i], studied: 0});    // 75 items from new list -> con
        prob_lib.push({img_name: prob_old[i], studied: 1});
        prob_con.push({img_name: prob_new[i], studied: 0});

    }
    for (i = study_list_length*0.75; i < study_list_length; i++) {
        baseline_lib.push({img_name: baseline_new[i], studied: 0});
        baseline_con.push({img_name: baseline_old[i], studied: 1});
        prob_lib.push({img_name: prob_new[i], studied: 0});
        prob_con.push({img_name: prob_old[i], studied: 1});
    }

    for (i = 0; i < study_list_length/2; i++) {            // FPF is 50/50 not 75/25
        fpf_lib.push({img_name: fpf_old[i], studied: 1});
        fpf_con.push({img_name: fpf_new[i], studied: 0});
    }
    for (i = study_list_length/2; i < study_list_length; i++) {
        fpf_lib.push({img_name: fpf_new[i], studied: 0});
        fpf_con.push({img_name: fpf_old[i], studied: 1});
    }

    shuffleArray(baseline_lib);    // shuffle again to mix up old/new
    shuffleArray(baseline_con);
    shuffleArray(prob_lib);
    shuffleArray(prob_con);
    shuffleArray(fpf_lib);
    shuffleArray(fpf_con);

    // roll dice to randomize lib/con in EACH task
    var lib_con_baseline = roll_dice(1,3);
    if (lib_con_baseline === 1) {
        var baseline_cond1 = baseline_lib;
        var baseline_cond2 = baseline_con;
        //console.log('baseline cond order == 1: lib-con');
        var lib_con_baseline_text = 'lib-con';
        curr_cond1 = 'lib';
        curr_cond2 = 'con';
    } else if (lib_con_baseline === 2) {
        baseline_cond1 = baseline_con;
        baseline_cond2 = baseline_lib;
        //console.log('baseline cond order == 2: con-lib');
        lib_con_baseline_text = 'con-lib';
        curr_cond1 = 'con';
        curr_cond2 = 'lib';
    }

    var lib_con_prob = roll_dice(1,3);
    if (lib_con_prob === 1) {
        var prob_cond1 = prob_lib;
        var prob_cond2 = prob_con;
        //console.log('prob cond order == 1: lib-con');
        var lib_con_prob_text = 'lib-con';
        curr_cond1 = 'lib';
        curr_cond2 = 'con';
        prob_hint_1 = '<br><p>Hint: 75% of images in this memory test are OLD.</p>';
        prob_hint_2 = '<br><p>Hint: 75% of images in this memory test are NEW.</p>'
    } else if(lib_con_prob === 2) {
        prob_cond1 = prob_con;
        prob_cond2 = prob_lib;
        //console.log('prob cond order == 2: con-lib');
        lib_con_prob_text = 'con-lib';
        curr_cond1 = 'con';
        curr_cond2 = 'lib';
        prob_hint_1 = '<br><p>Hint: 75% of images in this memory test are NEW.</p>';
        prob_hint_2 = '<br><p>Hint: 75% of images in this memory test are OLD.</p>'
    };

    var lib_con_fpf = roll_dice(1,3);
    if (lib_con_fpf === 1) {
        var fpf_cond1 = fpf_lib;
        var fpf_cond2 = fpf_con;
        //console.log('FPF cond order == 1: lib-con');
        var lib_con_fpf_text = 'lib-con';
    } else {
        fpf_cond1 = fpf_con;
        fpf_cond2 = fpf_lib;
        //console.log('FPF cond order == 2: con-lib');
        lib_con_fpf_text = 'con-lib';
    };

    // record lib-con order in data
    jsPsych.data.addProperties({
        cond_order_base: lib_con_baseline_text,
        cond_order_prob: lib_con_prob_text,
        cond_order_fpf: lib_con_fpf_text,
    });

    // log task name for procedure
    // prob/fpf order also needs to be logged in data
    // rolled order will be used to run timeline.push
    //var curr_task1 = 'baseline';
    var prob_fpf_order = roll_dice(1,3);
    if (prob_fpf_order === 1) {
        //var curr_task2 = 'prob';
        //var curr_task3 = 'false_feed';
        var prob_in_study = 2;
        var fpf_in_study = 3;
        //console.log("task order: " + prob_fpf_order + ", prob-fpf");
        var prob_fpf_order_text = 'prob/fpf order: 1=prob-fpf';
    } else if (prob_fpf_order === 2) {
        //curr_task2 = 'false_feed';
        //curr_task3 = 'prob';
        fpf_in_study = 2;
        prob_in_study = 3;
        //console.log("task order: " + prob_fpf_order + ", fpf-prob");
        prob_fpf_order_text = 'prob/fpf order: 2=fpf-prob';
    }
    jsPsych.data.addProperties({
        prob_fpf_order: prob_fpf_order_text,
    })


    var total_earned = 0;           // initialize $$$ counter
    var earned_this_trial = 0;      // trial by trial $$$ counter
    var reward_per_correct = 3;     // change this (instead of individually within proc) if payment scheme changes
    var penalty_per_wrong = 0;      // no penalty for incorrect in this one!!

    jsPsych.data.addProperties({
        study_reward: reward_per_correct,
        study_penalty: penalty_per_wrong,
    });


    // define trial by trial feedback text/style
    var feedback_yay = '<p style="font-weight:bold;color:green;">Correct!</p>';
    var feedback_nay = '<p style="font-weight:bold;color:red;">Wrong.</p>';
    var feedback_meh = '<p style="font-weight:bold;color:orange;">Too slow</p>';
    var feedback_interrupted = '<p style="font-weight:bold;color:orange;">Please respond faster.</p>' +
        '<p style="font-weight:bold;color:orange;">When you are ready, press ENTER to continue the memory test.</p>';

    // define fixation once to be used for all 3 tasks
    var fixation = {
        type: 'html-keyboard-response',
        stimulus: '+',
        choices: 'NO_KEYS',
        trial_duration: 200,
    };

    var too_slow = {
        type: 'html-keyboard-response',
        stimulus: function() {
            let resp_key = jsPsych.data.get().last(1).values()[0].response;
            if (resp_key === null) {
                // if no response given after 10s (max test trial duration)
                //console.log("Too slow!");
                return feedback_meh + feedback_interrupted;
            } else {return ''};
        },
        choices: function() {
            let resp_key = jsPsych.data.get().last(1).values()[0].response;
            if (resp_key === null) {
                return ['Enter'];
            } else {return ['NO_KEYS']};
        },
        stimulus_duration: function() {
            let resp_key = jsPsych.data.get().last(1).values()[0].response;
            if (resp_key === null) {
                return null;
            } else {return 0};
        },
        trial_duration: function() {
            // 200ms gap (ITI) if NOT null response
            let resp_key = jsPsych.data.get().last(1).values()[0].response;
            if (resp_key === null) {
                return null;
            } else {return 200};
        },
        response_ends_trial: function() {
            let resp_key = jsPsych.data.get().last(1).values()[0].response;
            if (resp_key === null) {
                return true;
            } else {return false};
        },
    };

    // define study start/end screen - dynamic display for each instance
    var study_phase_count = 0;    // must be declared as numeric instead of string, or it won't update incrementally (will only show the FINAL assigned value)
    var begin_study = {
        type: 'html-keyboard-response',
        stimulus: function() {
            study_phase_count +=1;   // update block # each time it's run
            return 'STUDY PHASE ' + study_phase_count + '/3' +
                '<p>Try to memorize these scene images.</p>';
        },
        prompt: 'Press ENTER to begin the study phase.',
        choices: ['Enter'],
        response_ends_trial: true,
    };

    var end_study = {
        type: 'html-keyboard-response',
        stimulus: function() {
            // no need to += since it's already done at the begin ins screen
            return study_phase_count + '/3 STUDY PHASE COMPLETE!';
        },
        prompt: 'Press ENTER to begin the memory test.',
        choices: ['Enter'],
        response_ends_trial: true,
    };

    var test_in_task = 0;  // needs to be reset in every task
    var begin_test = {
        type: 'html-keyboard-response',
        stimulus: function() {
            test_in_task += 1;
            if (test_in_task >= 3) {
                test_in_task = 1;
            };
            // reminder for $ based on accuracy
            var test_ins_any_text = 'This is memory test ' + test_in_task + ' of 2 for the study phase you just saw.' +
                '<p>There will not be any images in the memory test from other memory study or test phases, so focus on the current phase only.</p>' +
                '<p>Remember, your payout depends on how many test images you correctly identify as either old (it appeared in this study phase) or new (it did NOT appear in this study phase).</p>';
            // prompt to use additional cues to help accuracy in task 2/3, based on study_phase_count
            var test_ins_optional_text = '<p style="font-weight:bold">In this memory test, you can use information on screen to help you make your memory decisions.</p>';

            if (study_phase_count === 1) {
                return test_ins_any_text;
            } else if (study_phase_count > 1) {
                return test_ins_any_text + test_ins_optional_text;
            }
        },
        prompt: 'Press ENTER to begin memory test.',
        choices: ['Enter'],
        response_ends_trial: true,
    };


    var end_test = {
        type: 'html-keyboard-response',
        stimulus: function() {
            //the +1 needs to be wrapped in a function to show up correctly
            return 'Memory test ' + test_in_task + ' of 2 complete for current memory phase!';
        },
        prompt: 'Press ENTER to continue.',
        choices: ['Enter'],
        response_ends_trial: true,
    };




    // ============ WELCOME ==============
    var welcome = {
        type: 'html-keyboard-response',
        stimulus: ins_hi,
        choices: ['Enter'],
        response_ends_trial: true,
        post_trial_gap: 200,
    }
    timeline.push(welcome);

    // ============ CONSENT ==============

    var consent_form = {
        type: 'instructions',
        pages: [
            consent_1,
            consent_2,
            consent_3,
            consent_4,
            consent_5,
        ],
        button_label_next: 'Next',
        button_label_previous: 'Previous',
        show_clickable_nav: true,
        css_classes: ['align_left'],
    }
    timeline.push(consent_form);


    // ============ sub ID, initials, date/time, payment info =================
    var rand_subID = jsPsych.randomization.randomID(8);
    // add subID to all trials

        var trial_feedback_2 = {
            type: 'html-keyboard-response',
            //choices: 'NO_KEYS',
            choices: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                // NO KEYS if correct/wrong feedback, ENTER if too slow (no resp)
                if (resp_key === null) {
                    return ['Enter'];
                } else {return ['NO_KEYS']};
            },
            response_ends_trial: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                if (resp_key === null) {
                    return true;
                } else {return false};
            },
            //stimulus_duration: 500,
            stimulus_duration: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                // 500ms if correct/wrong feedback, null if too slow (no resp)
                if (resp_key === null) {
                    return null;
                } else {return 500};
            },
            //trial_duration: 700,
            trial_duration: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                // 200ms ITI (+500) if correct/wrong feedback, null if too slow (no resp)
                if (resp_key === null) {
                    return null;
                } else {return 700};
            },
            data: {
                n_trial: i_test,
                task: 'FPF',
                phase: 'test',
                test_in_task: 2,
                cond: curr_cond2,
                correct_resp: fpf_cond2[i_test].studied,

            },
            stimulus: function() {
                let last_trial_correct = jsPsych.data.get().last(1).values()[0].correct;
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                if (last_trial_correct) {
                    roll_fpf = 0;
                    trial_is_fpf = 0;
                    total_earned += reward_per_correct;
                    earned_this_trial = reward_per_correct;
                    if (resp_key === this_old_key) {  // resp=old, is correct: hit
                        return feedback_yay;
                    } else if (resp_key === this_new_key) {  // resp=new, is correct: CR
                        return feedback_yay;
                    }
                } else if (!last_trial_correct) {
                    if (resp_key === this_old_key) {  // resp=old, is wrong
                        if (lib_con_fpf === 2) {    // t2 is currently lib, go for FPF for fa
                            roll_fpf = 1;
                            fpf_trial_rolled_t2 +=1;
                            var fpf_chance = roll_dice(1, 101);
                            if (fpf_chance <= 75) {
                                //console.log("This is a lib FPF trial!");
                                trial_is_fpf = 1;
                                fpf_trial_count_t2 +=1;
                                total_earned += reward_per_correct;
                                earned_this_trial = reward_per_correct;
                                return feedback_yay;
                            } else {
                                //console.log("FA but not FPF!");
                                earned_this_trial = 0;
                                return feedback_nay;
                            }
                        } else if (lib_con_fpf === 1) {  // t2 is currently con, no FPF
                            earned_this_trial = 0;
                            return feedback_nay;
                        }

                    } else if (resp_key === this_new_key) {  // resp=new, is wrong: miss
                        if (lib_con_fpf === 2) {      // t2 is currently lib, no FPF for miss
                            roll_fpf = 0;
                            earned_this_trial = 0;
                            //console.log("roll FPF? ", roll_fpf);
                            return feedback_nay;
                        } else if (lib_con_fpf === 1) {  // t2 is currently con, go for FPF
                            roll_fpf = 1;
                            fpf_trial_rolled_t2 +=1;
                            //console.log("roll FPF? ", roll_fpf);
                            fpf_chance = roll_dice(1, 101);
                            if (fpf_chance <= 75) {
                                //console.log("This is a con FPF trial!");
                                trial_is_fpf = 1;
                                fpf_trial_count_t2 +=1;
                                total_earned += reward_per_correct;
                                earned_this_trial = reward_per_correct;
                                return feedback_yay;
                            } else {
                                earned_this_trial = 0;
                                trial_is_fpf = 0;
                                //console.log("Miss but not FPF!");
                                return feedback_nay;
                            }
                        }
                    } else if (resp_key === null) {
                        roll_fpf = 0;
                        trial_is_fpf = 0;
                        earned_this_trial = 0;
                        //console.log("roll FPF? ", roll_fpf);
                        return feedback_meh + feedback_interrupted;
                    }
                }
            },
            on_finish: function(data){
                data.roll_fpf = roll_fpf;
                data.trial_is_fpf = trial_is_fpf;
                data.earned_this_trial = earned_this_trial;
                data.earned_so_far = total_earned;
                //console.log("earned so far (c): ", total_earned);
            },
        };

        if (prob_fpf_order === 1) {
            timeline.push(fpf_test_2, trial_feedback_2);
        } else if (prob_fpf_order === 2) {
            timeline.push(prob_test_2, too_slow);
        }
    };

    timeline.push(end_test);



    // ==================== END OF ALL 3 TASKS ==========================
    var end_all_task = {
        type: 'html-keyboard-response',
        stimulus: 'All memory study and test phases complete!',
        prompt: 'Press ENTER to continue.',
        choices: ['Enter'],
        response_ends_trial: true,
        post_trial_gap: 300,
    };
    timeline.push(end_all_task);


    // ==================== count/show total $ earned ==================
    var show_total_earned = {
        type: 'html-keyboard-response',
        // need to wrap global var in function for it to be accessible!!!
        stimulus: function () {
            var total_earned_dol = total_earned / 100;
            return 'You earned $' + total_earned_dol + ' in this study!';
        },
        prompt:
            '<p>Please take a screenshot or photo for your record. We will send you the payment and a DocuSign receipt for you to sign by the end of the day.</p><p></p>' +
            '<p>For the final part of the study, you will answer some questions about your experience in the study.</p>' +
            '<p>Press ENTER to submit your study data, then speak to the experimenter.</p>',
        choices: ['Enter'],
        post_trial_gap: 300,

        // log payment amount in all trials for easy access
        // verify in data (collected) that this matches with total # correct (including FPF)
        on_finish: function (data) {
            data.total_earned_amt = total_earned;
        },
    }

    //jsPsych.data.addProperties({
    //    total_earned_amt_final: total_earned    // this doesn't work because total_earned is added at the beginning when it was 0
    //});  // tag total amount earned to ALL trials for easy access & verification

    timeline.push(show_total_earned);


    // ==================== save data ==================================

    function saveData(name, data) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'write_data.php'); // 'write_data.php' is the path to the php file described above.
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({filedata: data}));
    }

    /* finish connection with pavlovia.org */
    var pavlovia_finish = {
        on_start: function() {
            saveData(jsPsych.data.get().csv());
        },
        type: "pavlovia",
        command: "finish"
    };
    timeline.push(pavlovia_finish);


    jsPsych.init({
        timeline: timeline,
        override_safe_mode: true,
        on_finish: function () {
            console.log('Experiment finished!');
            saveData(jsPsych.data.get().csv());
            //jsPsych.data.displayData();                 // no need to display data for online version
            // redirect to FPF awareness survey (Qualtrics)  // this affects how
            //window.location = "https://ucsb.co1.qualtrics.com/jfe/form/SV_0JybtP8p2s1qZqm"
        }
    })

</script>
