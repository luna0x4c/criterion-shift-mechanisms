    function shuffleArray(array) {  // shuffle a one dimensional array / one level shuffling
        for (var i = array.length-1; i > 0; i--) {

            var temp = array[i];
            array[i] = array[j];
            array[j] = temp;

                        earned_this_trial = 0;
                        console.log("roll FPF? ", roll_fpf);
                        return feedback_meh + feedback_interrupted;
                    }
                };
                console.log("roll FPF? ", roll_fpf);
            },
            on_finish: function(data){
                data.roll_fpf = roll_fpf;
                data.trial_is_fpf = trial_is_fpf;
                data.earned_so_far = total_earned;
                data.earned_this_trial = earned_this_trial;
                console.log("earned so far (c): ", total_earned);
            },
        };

        if (prob_fpf_order === 1) {
            timeline.push(fpf_test_1, trial_feedback_1);
        } else if (prob_fpf_order === 2) {
            timeline.push(prob_test_1, too_slow);
        }
    };

    timeline.push(end_test);


    // task 2 test 2
    timeline.push(begin_test);

    i_test = 0;
    for (i_test = 0; i_test < study_list_length; i_test++) {
        var prob_test_2 = {
            type: 'image-keyboard-response',
            stimulus: prob_cond2[i_test].img_name,
            choices: [old_low_key, old_high_key, new_low_key, new_high_key],
            prompt: old_new_key_prompt + prob_hint_2,
            trial_duration: 10000,
            response_ends_trial: true,
            data: {
                n_trial: i_test,
                task: 'prob',
                task_order: prob_in_study,
                phase: 'test',
                test_in_task: 2,
                cond: curr_cond2,
                correct_resp: prob_cond2[i_test].studied,
            },
            on_finish: function (data) {
                console.log("n_trial: ", data.n_trial+1);
                console.log("studied 1/0: ", data.correct_resp);

                // log resp confidence level
                if (data.response === old_low_key || data.response === new_low_key) {
                  data.response_confidence = "low";
                } else if (data.response === old_high_key || data.response === new_high_key) {
                  data.response_confidence = "high";
                } else if (data.response === null) {
                  data.response_confidence = null;
                }
                console.log("confidence: ", data.response_confidence);

                // log resp accuracy
                if (data.response === old_low_key || data.response === old_high_key) {
                    data.response_translated = 1;
                } else if (data.response === new_low_key || data.response === new_high_key) {
                    data.response_translated = 0;
                } else if (data.response === null) {
                    data.response_translated = 99;
                };
                console.log("response 1/0: ", data.response_translated);

                // log resp type:
                if (jsPsych.pluginAPI.compareKeys(data.response_translated, data.correct_resp)) {
                    data.correct = true;
                    data.earned_this_trial = reward_per_correct;
                    if (data.response_translated === 1) {
                        data.resp_type_real = 'hit';  // resp=old, is correct: hit
                    } else if (data.response_translated === 0) {
                        data.resp_type_real = "cr";   // resp=new, is correct: CR
                    } else {
                        data.resp_type_real = null;   // no response (technically not needed if correct but just in case)
                    }
                }
                else {
                    data.correct = false;
                    data.earned_this_trial = 0;
                    if (data.response_translated === 1) {
                        data.resp_type_real = "fa";   // resp=old, incorrect: FA (lib)
                    } else if (data.response_translated === 0) {
                        data.resp_type_real = "miss"; // resp=new, incorrect: miss (con)
                    } else {
                        data.resp_type_real = null;
                    }
                };
                console.log("is correct: ", data.correct);
                console.log("resp type real: ", data.resp_type_real);

                if (data.correct) {
                    total_earned = total_earned + reward_per_correct;
                    data.earned_so_far = total_earned;
                }
                console.log("earned so far (c): ", total_earned);
            }
        };

        var fpf_test_2 = {
            type: 'image-keyboard-response',
            stimulus: fpf_cond2[i_test].img_name,
            choices: [old_low_key, old_high_key, new_low_key, new_high_key],
            prompt: old_new_key_prompt,
            trial_duration: 10000,
            response_ends_trial: true,
            data: {
                n_trial: i_test,
                task: 'FPF',
                task_order: fpf_in_study,
                phase: 'test',
                test_in_task: 2,
                cond: curr_cond2,
                correct_resp: fpf_cond2[i_test].studied,
            },
            on_finish: function(data){
                console.log("n_trial: ", data.n_trial+1);
                console.log("studied 1/0: ", data.correct_resp);

                // log resp confidence level
                if (data.response === old_low_key || data.response === new_low_key) {
                  data.response_confidence = "low";
                } else if (data.response === old_high_key || data.response === new_high_key) {
                  data.response_confidence = "high";
                } else if (data.response === null) {
                  data.response_confidence = null;
                }
                console.log("confidence: ", data.response_confidence);

                // log resp accuracy
                if (data.response === old_low_key || data.response === old_high_key) {
                    data.response_translated = 1;
                } else if (data.response === new_low_key || data.response === new_high_key) {
                    data.response_translated = 0;
                } else if (data.response === null) {
                    data.response_translated = 99;
                }
                console.log("response 1/0: ", data.response_translated);

                if (jsPsych.pluginAPI.compareKeys(data.response_translated, data.correct_resp)) {
                    data.correct = true;
                    if (data.response_translated === 1) {
                        data.resp_type_real = 'hit';  // resp=old, is correct: hit
                    } else if (data.response_translated === 0) {
                        data.resp_type_real = "cr"; // resp=new, is correct: CR
                    } else {
                        data.resp_type_real = null;  // no response (technically not needed if correct but just in case)
                    }
                }
                else {
                    data.correct = false;
                    if (data.response_translated === 1) {
                        data.resp_type_real = "fa";  // resp=old, incorrect: FA (lib)
                    } else if (data.response_translated === 0) {
                        data.resp_type_real = "miss"; // resp=new, incorrect: miss (con)
                    } else {
                        data.resp_type_real = null;
                    }
                }
                console.log("is correct: ", data.correct);
                console.log("resp type real: ", data.resp_type_real);
            }
        }

        var trial_feedback_2 = {
            type: 'html-keyboard-response',
            //choices: 'NO_KEYS',
            choices: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                // NO KEYS if correct/wrong feedback, ENTER if too slow (no resp)
                if (resp_key === null) {
                    return ['Enter'];
                } else {return ['NO_KEYS']};
            },
            response_ends_trial: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                if (resp_key === null) {
                    return true;
                } else {return false};
            },
            //stimulus_duration: 500,
            stimulus_duration: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                // 500ms if correct/wrong feedback, null if too slow (no resp)
                if (resp_key === null) {
                    return null;
                } else {return 500};
            },
            //trial_duration: 700,
            trial_duration: function() {
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                // 200ms ITI (+500) if correct/wrong feedback, null if too slow (no resp)
                if (resp_key === null) {
                    return null;
                } else {return 700};
            },
            data: {
                n_trial: i_test,
                task: 'FPF',
                phase: 'test',
                test_in_task: 2,
                cond: curr_cond2,
                correct_resp: fpf_cond2[i_test].studied,

            },
            stimulus: function() {
                let last_trial_correct = jsPsych.data.get().last(1).values()[0].correct;
                let resp_key = jsPsych.data.get().last(1).values()[0].response;
                if (last_trial_correct) {
                    roll_fpf = 0;
                    trial_is_fpf = 0;
                    total_earned += reward_per_correct;
                    earned_this_trial = reward_per_correct;
                    if (resp_key === this_old_low_key || resp_key === this_old_high_key) {  // resp=old, is correct: hit
                        return feedback_yay;
                    } else if (resp_key === this_new_low_key || resp_key === this_new_high_key) {  // resp=new, is correct: CR
                        return feedback_yay;
                    }
                } else if (!last_trial_correct) {
                    if (resp_key === this_old_low_key || resp_key === this_old_high_key) {  // resp=old, is wrong
                        if (lib_con_fpf === 2) {    // t2 is currently lib, go for FPF for fa
                            roll_fpf = 1;
                            fpf_trial_rolled_t2 +=1;
                            var fpf_chance = roll_dice(1, 101);
                            if (fpf_chance <= 75) {
                                console.log("This is a lib FPF trial!");
                                trial_is_fpf = 1;
                                fpf_trial_count_t2 +=1;
                                total_earned += reward_per_correct;
                                earned_this_trial = reward_per_correct;
                                return feedback_yay;
                            } else {
                                console.log("FA but not FPF!");
                                earned_this_trial = 0;
                                return feedback_nay;
                            }
                        } else if (lib_con_fpf === 1) {  // t2 is currently con, no FPF
                            earned_this_trial = 0;
                            return feedback_nay;
                        }

                    } else if (resp_key === this_new_low_key || resp_key === this_new_high_key) {  // resp=new, is wrong: miss
                        if (lib_con_fpf === 2) {      // t2 is currently lib, no FPF for miss
                            roll_fpf = 0;
                            earned_this_trial = 0;
                            console.log("roll FPF? ", roll_fpf);
                            return feedback_nay;
                        } else if (lib_con_fpf === 1) {  // t2 is currently con, go for FPF
                            roll_fpf = 1;
                            fpf_trial_rolled_t2 +=1;
                            console.log("roll FPF? ", roll_fpf);
                            fpf_chance = roll_dice(1, 101);
                            if (fpf_chance <= 75) {
                                console.log("This is a con FPF trial!");
                                trial_is_fpf = 1;
                                fpf_trial_count_t2 +=1;
                                total_earned += reward_per_correct;
                                earned_this_trial = reward_per_correct;
                                return feedback_yay;
                            } else {
                                earned_this_trial = 0;
                                trial_is_fpf = 0;
                                console.log("Miss but not FPF!");
                                return feedback_nay;
                            }
                        }
                    } else if (resp_key === null) {
                        roll_fpf = 0;
                        trial_is_fpf = 0;
                        earned_this_trial = 0;
                        console.log("roll FPF? ", roll_fpf);
                        return feedback_meh + feedback_interrupted;
                    }
                }
            },
            on_finish: function(data){
                data.roll_fpf = roll_fpf;
                data.trial_is_fpf = trial_is_fpf;
                data.earned_this_trial = earned_this_trial;
                data.earned_so_far = total_earned;
                console.log("earned so far (c): ", total_earned);
            },
        };

        if (prob_fpf_order === 1) {
            timeline.push(fpf_test_2, trial_feedback_2);
        } else if (prob_fpf_order === 2) {
            timeline.push(prob_test_2, too_slow);
        }
    };

    timeline.push(end_test);



    // ==================== END OF BOTH MEM TASKS ==========================
    var end_all_task = {
        type: 'html-keyboard-response',
        stimulus: 'All memory study and test phases complete!',
        prompt: 'Press RETURN to continue.',
        choices: ['Enter'],
        response_ends_trial: true,
        post_trial_gap: 300,
    };
    timeline.push(end_all_task);


    // ==================== count/show total $ earned ==================
    var show_total_earned = {
        type: 'html-keyboard-response',
        // need to wrap global var in function for it to be accessible!!!
        stimulus: function () {
            var total_earned_dol = total_earned / 100;
            return 'You earned $' + total_earned_dol + ' from the study!';
        },
        prompt:
            '<p>Your final payment amount has been recorded in the data, but you can take a photo for your own record.</p>' +
            '<p>We will send you your payment and a DocuSign payment acknowledgement form in the next 2-3 days.</p>' +
            '<p>For the final part of the study, you will answer some survey questions about your experience in the study.</p>' +
            '<p>Press RETURN to submit your study data. Then, you will be redirected to the survey.</p>',
        choices: ['Enter'],
        post_trial_gap: 200,

        // log payment amount in all trials for easy access
        // verify in data (collected) that this matches with total # correct (including FPF)
        on_finish: function (data) {
            data.total_earned_amt = total_earned;
        },
    }

    //jsPsych.data.addProperties({
    //    total_earned_amt_final: total_earned    // this doesn't work because total_earned is added at the beginning when it was 0
    //});  // tag total amount earned to ALL trials for easy access & verification

    timeline.push(show_total_earned);

        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({filedata: data}));
